<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatwave Advisory Subscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><h1>Heatwave Advisory Subscription</h1><p>Receive heatwave alerts for your selected region</p></header>
<nav><ul><li><a href="index.html">Home</a></li><li><a href="forecast.html">Forecast</a></li><li><a href="subscribe.html">Subscribe</a></li></ul></nav>
<main class="content">
<form action="#" method="post">
  <fieldset>
    <legend>Subscribe for Heatwave Alerts</legend>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit number" required>

    <label for="region">Select Region:</label>
    <select id="region" name="region">
      <option value="north">North Zone</option>
      <option value="central">Central Zone</option>
      <option value="south">South Zone</option>
      <option value="east">East Zone</option>
      <option value="west">West Zone</option>
    </select>

    <p>Preferred Alert Language:</p>
    <label><input type="radio" name="language" value="english" checked> English</label>
    <label><input type="radio" name="language" value="hindi"> Hindi</label>
    <label><input type="radio" name="language" value="marathi"> Marathi</label>

    <p>Alert Types:</p>
    <label><input type="checkbox" name="alert_type" value="sms" checked> SMS Alerts</label>
    <label><input type="checkbox" name="alert_type" value="email"> Email Alerts</label>
    <label><input type="checkbox" name="alert_type" value="app"> App Notification</label>

    <div class="form-buttons">
      <input type="submit" value="Subscribe">
      <input type="reset" value="Reset">
    </div>
  </fieldset>
</form>
</main>
<footer>Heatwave Intelligence System</footer>
</body>
</html>
